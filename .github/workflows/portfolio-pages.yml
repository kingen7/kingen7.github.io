name: Deploy portfolio to Pages

on:
  push:
    branches: [portfolio]
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'kingen7/kingen7.github.io' && github.ref == 'refs/heads/portfolio'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          VITE_GITHUB_PAGES: "true"
      - run: node scripts/build-pages.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
